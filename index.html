<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Team</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #f2f2f2, #e6e6e6);
            color: #333;
            margin: 0;
            padding: 0;
        }
        header {
            background: #333;
            color: #fff;
            padding: 20px;
            text-align: center;
        }
        section {
            padding: 20px;
        }
        .team {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            margin: 20px 0;
        }
        .member {
            background: white;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            width: 200px;
            margin: 15px;
            padding: 15px;
            transition: transform 0.3s;
        }
        .member:hover {
            transform: translateY(-10px) scale(1.05);
        }
        h2 {
            font-size: 24px;
            margin: 10px 0;
        }
        p {
            font-size: 16px;
            text-align: center;
        }
    </style>
</head>
<body>
    <header>
        <h1>Meet Our Founders</h1>
    </header>
    <section>
        <div class="team">
            <div class="member">
                <h2>Jithin</h2>
                <p>Founder & CEO</p>
            </div>
            <div class="member">
                <h2>Shiv</h2>
                <p>Co-founder</p>
            </div>
            <div class="member">
                <h2>Spidey</h2>
                <p>Co-founder</p>
            </div>
            <div class="member">
                <h2>Jod</h2>
                <p>Co-founder</p>
            </div>
            <div class="member">
                <h2>Nidhi</h2>
                <p>Co-founder</p>
            </div>
        </div>
    </section>
</body>
</html>
